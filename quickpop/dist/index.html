<head>

  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>QuickPop – Streaming vidéo réservé</title>
  <meta name="description" content="Streaming vidéo réservé.">
  <link rel="canonical" href="https://quick-pop.web.app/">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://quick-pop.web.app/">
  <meta property="og:title" content="QuickPop – Plateforme de contenu interactif">
  <meta property="og:description" content="Découvrez QuickPop, la plateforme moderne pour gérer et diffuser du contenu multimédia pour Quick.">
  <meta property="og:image" content="https://quick-pop.web.app/og-image.png?v=1">
  <meta property="og:image:secure_url" content="https://quick-pop.web.app/og-image.png?v=1">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://quick-pop.web.app/">
  <meta property="twitter:title" content="QuickPop – Plateforme de contenu interactif">
  <meta property="twitter:description" content="Découvrez QuickPop, la plateforme moderne pour gérer et diffuser du contenu multimédia pour Quick.">
  <meta property="twitter:image" content="https://quick-pop.web.app/og-image.png?v=1">
  
  <!-- PWA -->
  <link rel="icon" href="/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  
  <meta name="theme-color" content="#f8fafc">
  
  <!-- Sécurité   -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --bg-secondary: #ffffff;
      --text: #0f172a;
      --text-dim: #64748b;
      --accent: #3b82f6;
      --error: #ef4444;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg-secondary) 100%);
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }


    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 1.1rem;
      font-weight: 500;
      opacity: 0.9;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.5; }
    }

    .loading-emoji {
      font-size: 2rem;
      margin-left: 0.5rem;
      animation: bounce 1.5s ease infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .message-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: var(--bg);
    }

    .message-screen h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: var(--error);
    }

    .message-screen p {
      font-size: 1.1rem;
      max-width: 600px;
      line-height: 1.8;
      color: var(--text-dim);
    }

    .message-screen a {
      color: var(--accent);
      text-decoration: underline;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #root {
      min-height: 100vh;
    }


    /* HTML: <div class="loader"></div> */
.loader {
  height: 4px;
  width: 130px;
  --c:no-repeat linear-gradient(#ee0000 0 0);
  background: var(--c),var(--c),#fcb8b8;
  background-size: 60% 100%;
  animation: l16 3s infinite;
}
@keyframes l16 {
  0%   {background-position:-150% 0,-150% 0}
  66%  {background-position: 250% 0,-150% 0}
  100% {background-position: 250% 0, 250% 0}
}
  </style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "QuickPop",
    "description": "Plateforme moderne de streaming et gestion de contenu multimédia",
    "url": "https://quickpop.com",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "Web"
  }
  </script>
  <script type="module" crossorigin src="/assets/index-ftwYzcQu.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CUtsbv9E.css">
<link rel="manifest" href="/manifest.webmanifest"></head>

<body>
  <noscript>
    <div class="message-screen">
      <h1>⚠️ JavaScript requis</h1>
      <p>
        QuickPop nécessite JavaScript pour fonctionner correctement.<br>
        Veuillez activer JavaScript dans les paramètres de votre navigateur et recharger la page.
      </p>
      <p style="margin-top: 2rem; font-size: 0.95rem;">
        Si vous rencontrez des difficultés, consultez 
        <a href="https://www.enable-javascript.com/fr/" target="_blank" rel="noopener noreferrer">ce guide</a>
      </p>
    </div>
  </noscript>

  <div id="loading-screen" aria-live="polite" aria-label="Chargement de l'application">
    <div class="loader" role="status" aria-label="Chargement en cours"></div>
  </div>

  <div id="root"></div>


  <script>
    // Masquer le loading screen
    window.addEventListener('load', () => {
      const loading = document.getElementById('loading-screen');
      if (loading) {
        setTimeout(() => {
          loading.classList.add('fade-out');
          setTimeout(() => loading.remove(), 500);
        }, 500);
      }
    });

    // Gestion d'erreur globale
    window.addEventListener('error', (e) => {
      console.error('Erreur:', e.error);
    });

    // Détection navigateur moderne
    const isModern = () => {
      try {
        return typeof Promise !== 'undefined' && 
               typeof fetch !== 'undefined' && 
               typeof Symbol !== 'undefined';
      } catch (e) {
        return false;
      }
    };

    if (!isModern()) {
      document.getElementById('root').innerHTML = `
        <div class="message-screen">
          <h1>⚠️ Navigateur non supporté</h1>
          <p>
            Votre navigateur est trop ancien pour utiliser QuickPop.<br>
            Veuillez le mettre à jour ou utiliser un navigateur moderne comme 
            <strong>Chrome</strong>, <strong>Firefox</strong>, <strong>Safari</strong> ou <strong>Edge</strong>.
          </p>
        </div>
      `;
    }

    // Performance monitoring
    if ('performance' in window) {
      window.addEventListener('load', () => {
        setTimeout(() => {
          const perf = performance.getEntriesByType('navigation')[0];
          if (perf) {
            console.log('⏱️ Temps de chargement:', Math.round(perf.loadEventEnd - perf.fetchStart), 'ms');
          }
        }, 0);
      });
    }
  </script>
</body>
</html>
